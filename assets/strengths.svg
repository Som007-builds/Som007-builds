<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 196" width="1000" height="196" role="img" aria-label="What I bring: backend and AI systems, frontend and web, evidence over claims."><title>What I bring: backend and AI systems, frontend and web, evidence over claims.</title><rect width="1000" height="196" fill="#080808"/><line x1="0" y1="0.5" x2="1000" y2="0.5" stroke="#484846" stroke-width="1" stroke-dasharray="1 6"/><text x="0" y="42" font-family="'Courier New', Courier, monospace" font-size="8.6" font-weight="400" text-anchor="start" letter-spacing="1.6" fill="#AAA9A4">BUILT IN THE PROJECTS</text><text x="0" y="76" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" letter-spacing="-0.3" fill="#F1F0EB">Backend &amp; AI systems</text><text x="0" y="108" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="400" text-anchor="start" fill="#AAA9A4">Python and FastAPI services; SQLite,</text><text x="0" y="126" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="400" text-anchor="start" fill="#AAA9A4">DuckDB, Neo4j, ChromaDB and Qdrant;</text><text x="0" y="144" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="400" text-anchor="start" fill="#AAA9A4">hosted APIs to local Ollama.</text><line x1="326" y1="20" x2="326" y2="174" stroke="#292928" stroke-width="1"/><text x="347" y="42" font-family="'Courier New', Courier, monospace" font-size="8.6" font-weight="400" text-anchor="start" letter-spacing="1.6" fill="#AAA9A4">APPLIED IN THIS SITE</text><text x="347" y="76" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" letter-spacing="-0.3" fill="#F1F0EB">Frontend &amp; web</text><text x="347" y="108" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" fon