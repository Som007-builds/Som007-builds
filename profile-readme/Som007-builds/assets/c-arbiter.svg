<text x="26" y="82" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#F2F0E8">Foretyx / Arbiter</text><text x="26" y="112" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".82">A policy-aware gateway between applications and AI</text><text x="26" y="133" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".82">models. Checks who is asking, strips sensitive data,</text><text x="26" y="154" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".82">and logs the decision. Built for Aadhaar, PAN, GSTIN.</text><rect x="26" y="190" width="132.8" height="24" rx="12" fill="none" stroke="#E6C46A" stroke-width="1.2"/><circle cx="40" cy="202" r="3.5" fill="#E6C46A"/><text x="50" y="206" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.2" fill="#E6C46A">DESIGN STAGE</text><text x="468" y="206" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8DA397">Policy · PII redaction · Audit</text></svg>