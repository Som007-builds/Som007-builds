<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="Working principles"><title>Working principles</title><rect x="0" y="0" width="320" height="176" rx="16" fill="#141C18"/><rect x="0.5" y=".5" width="319" height="175" rx="16" fill="none" stroke="#24382E"/>
<text x="24" y="44" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#B5D7B9">01</text>
<line x1="56" y1="39" x2="296" y2="39" stroke="#315D46" stroke-width="1"/>
<text x="24" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#F2F0E8">Fail closed.</text>
<text x="24" y="114" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".78">If the protection layer is down,</text>
<text x="24" y="135" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".78">the data does not move.</text><rect x="340" y="0" width="320" height="176" rx="16" fill="#141C18"/><rect x="340.5" y=".5" width="319" height="175" rx="16" fill="none" stroke="#24382E"/>
<text x="364" y="44" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#B5D7B9">02</text>
<line x1="396" y1="39" x2="636" y2="39" stroke="#315D46" stroke-width="1"/>
<text x="364" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#F2F0E8">Hypotheses, not verdicts.</text>
<text x="364" y="114" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".78">A model's output is a lead to check.</text>
<text x="364" y="135" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".78">Every finding carries its evidence.</text><rect x="680" y="0" width="320" height="176" rx="16" fill="#141C18"/><rect x="680.5" y=".5" width="319" height="175" rx="16" fill="none" stroke="#24382E"/>
<text x="704" y="44" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#B5D7B9">03</text>
<line x1="736" y1="39" x2="976" y2="39" stroke="#315D46" stroke-width="1"/>
<text x="704" y="84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#F2F0E8">Say what runs.</text>
<text x="704" y="114" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".78">Built, designed, or missing:</text>
<text x="704" y="135" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#F2F0E8" opacity=".78">every project states which one.</text></svg>